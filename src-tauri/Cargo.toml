[package]
name = "mediafinder"
version = "0.1.0"
description = "Công cụ tìm kiếm media siêu tốc cho Windows/NTFS"
edition = "2021"
rust-version = "1.77"

# A lib target is required so criterion benches and unit tests can import the
# index/search code (benches cannot link against a bin-only crate).
[lib]
name = "mediafinder"
path = "src/lib.rs"

[[bin]]
name = "mediafinder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Core index + search (P2) ---
rayon = "1"
memchr = "2"
unicode-normalization = "0.1"
arc-swap = "1"
parking_lot = "0.12"
bincode = "1.3"

# --- Media (P5) ---
# `image` only for PNG encoding; decoding is Windows' job via the shell
# thumbnail API, which already understands every codec installed on the machine.
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.12"

# --- Diagnostics ---
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search"
harness = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# `panic = "abort"` deliberately absent (RISK-001). It shrinks the binary, but
# it also means a panic anywhere — including inside a Tauri command handling a
# filename nobody anticipated — takes the whole application down with no
# warning. For a tool meant to sit open all day that trade is wrong. Commands
# additionally return `Result` rather than unwrapping, so the usual causes turn
# into an error message instead of a panic at all.

# Indexing 200k+ records through a debug-mode parser is painfully slow, so keep
# dependencies optimised even in dev builds.
[profile.dev.package."*"]
opt-level = 2
