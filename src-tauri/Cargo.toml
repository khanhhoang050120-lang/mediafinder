[package]
name = "mediafinder"
version = "1.0.0"
description = "Công cụ tìm kiếm media siêu tốc cho Windows/NTFS"
edition = "2021"
rust-version = "1.77"

# A lib target is required so criterion benches and unit tests can import the
# index/search code (benches cannot link against a bin-only crate).
[lib]
name = "mediafinder"
path = "src/lib.rs"

[[bin]]
name = "mediafinder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: closing the window hides it instead of quitting, and the tray is
# then the only visible sign the program is still there. Without it, a user who
# tidies the window away would silently lose the global hotkey — which is the
# main way in.
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# A launcher that has to be found and clicked is not a launcher. The hotkey is
# what makes this reachable mid-task without leaving whatever you were doing.
tauri-plugin-global-shortcut = "2"
# Pressing the hotkey must reach the window that is already open, not start a
# second copy that reads the same cache all over again.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Core index + search (P2) ---
rayon = "1"
memchr = "2"
unicode-normalization = "0.1"
arc-swap = "1"
parking_lot = "0.12"
bincode = "1.3"

# --- Media (P5) ---
# `image` only for PNG encoding; decoding is Windows' job via the shell
# thumbnail API, which already understands every codec installed on the machine.
image = { version = "0.25", default-features = false, features = ["png"] }
lru = "0.12"
# Fast, and this is not defending against an adversary — only telling apart
# files that a person put on their own disk.
blake3 = "1"

# --- Diagnostics ---
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Tự cập nhật ---
# Bộ cài nặng hơn 200 MB và không nằm ở đâu ngoài trang Releases, nên nếu
# người dùng không tự đi tìm thì họ ở lại bản cũ mãi. Plugin này để chính
# ứng dụng nói cho họ biết có bản mới.
#
# Nó chỉ tải về những gì đã ký bằng khoá riêng của dự án (khoá công khai nằm
# trong `tauri.conf.json`), nên kể cả khi ai đó chiếm được trang Releases và
# thay tệp cài, bản giả vẫn bị từ chối.
tauri-plugin-updater = "2"
# Sau khi cài xong phải khởi động lại thì bản mới mới có hiệu lực; đây là
# thứ cung cấp lệnh restart đó.
tauri-plugin-process = "2"


[dev-dependencies]
# Chỉ dùng trong test: tái hiện đúng bước chuẩn hoá đường dẫn mà crate `drag`
# làm bên trong, thay vì đoán.
dunce = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search"
harness = false

[target.'cfg(windows)'.dependencies]
# `#[implement]` sinh mã tham chiếu tới `windows_core` theo tên, nên crate đó
# phải có mặt trực tiếp chứ không chỉ qua re-export của `windows`.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Threading",
    # RegGetValueW: kiem tra WebView2 va phien ban Windows truoc khi mo cua so.
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # DoDragDrop + IDropSource: kéo tệp ra ngoài như một nguồn kéo OLE gốc.
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    # WNetGetConnectionW: cho biết một ổ mạng đang trỏ tới đâu, để thông báo
    # nêu được tên máy chủ chứ không chỉ nêu chữ cái ổ đĩa.
    "Win32_NetworkManagement_WNet",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# `panic = "abort"` deliberately absent (RISK-001). It shrinks the binary, but
# it also means a panic anywhere — including inside a Tauri command handling a
# filename nobody anticipated — takes the whole application down with no
# warning. For a tool meant to sit open all day that trade is wrong. Commands
# additionally return `Result` rather than unwrapping, so the usual causes turn
# into an error message instead of a panic at all.

# Indexing 200k+ records through a debug-mode parser is painfully slow, so keep
# dependencies optimised even in dev builds.
[profile.dev.package."*"]
opt-level = 2
