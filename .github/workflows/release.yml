# Build bộ cài MediaFinder và đăng lên GitHub Releases.
#
# Cách phát hành một bản mới:
#   0. Viết "có gì mới" vào RELEASE_NOTES.md (ở gốc repo). Nội dung này đi
#      vào latest.json và ứng dụng cũ HIỆN NÓ trong hộp thoại mời cập nhật —
#      viết cho người dùng đọc, không phải cho lập trình viên.
#      Tối đa ~1200 ký tự — vượt là build TỰ CHẶN (scripts/check-release-notes.sh);
#      chi tiết dài viết vào mô tả trên trang Releases, hộp thoại không hiện.
#   1. Sửa version cho khớp nhau ở tất cả các chỗ sau:
#        src-tauri/tauri.conf.json   <- nguồn sự thật, Tauri đọc file này
#        package.json
#        package-lock.json           <- hai chỗ; lệch là `npm ci` fail ngay
#        src-tauri/Cargo.toml
#        src-tauri/Cargo.lock        <- dòng version của crate `mediafinder`
#   2. git commit
#   3. git tag v1.0.1 && git push origin <nhánh> --tags
#
# Đẩy tag lên là workflow tự chạy. Khoảng 10-20 phút sau, bản Release có sẵn
# file .exe cho người dùng tải.
#
# ---------------------------------------------------------------------------
# TAG GẮN VÀO COMMIT, KHÔNG GẮN VÀO NHÁNH
#
# Workflow này chạy khi đẩy **tag**, không phải khi đẩy nhánh. Mà tag thì dán
# được vào bất kỳ commit nào, trên bất kỳ nhánh nào — nên phát hành từ `edit`
# hoàn toàn được, và `master` cứ đứng yên làm bản cứu vớt.
#
# Bộ cập nhật trên máy người dùng KHÔNG biết nhánh là gì. Nó hỏi đúng một địa
# chỉ (`.../releases/latest/download/latest.json`) rồi so số hiệu. Máy đang ở
# v1.0.4 hay v1.0.5 đều nhận thông báo như nhau, bất kể tag đến từ nhánh nào —
# endpoint và khoá công khai giữ nguyên từ v1.0.4 tới nay.
#
# Nên hai thứ này là hai cần gạt riêng, đừng gộp:
#   * NHÁNH          — code nằm ở đâu trong lịch sử. Người dùng không thấy.
#   * TRẠNG THÁI RELEASE — ai nhận được bản mới. Đây mới là thứ cần cân nhắc.
#
# PHÁT HÀNH THEO ĐỢT (cách dùng hiện tại):
#   a. Tag trên `edit`, đẩy tag. CI dựng, tạo Release dạng **nháp**.
#   b. Vào xem, bấm Publish → nó thành **pre-release**: không máy nào tự cập
#      nhật, nhưng `.exe` tải được. Đưa link cho vài người thử.
#   c. Chạy vài ngày thấy ổn → bỏ tick "Set as a pre-release". Lúc đó cả
#      studio mới nhận thông báo.
#   d. Có chuyện → tick lại. Máy chưa nâng dừng ngay. Máy đã nâng thì cài đè
#      bản cũ từ trang Releases (`ALLOWDOWNGRADES` = true).
#   e. Gộp lên `master` SAU bước (c), khi đã tin. Đó thuần tuý là ghi sổ.
#
# DẶN NGƯỜI THỬ: cài tay đè lên bản ≤ v1.0.5 thì trang chọn của bộ cài có hai
# nút, nút trên **được tích sẵn** và nó XOÁ chỉ mục — vì bộ gỡ chạy lúc đó là
# bộ gỡ CŨ đang nằm trên máy, mang lỗi BUG-024. Bảo họ chọn nút dưới ("Do not
# uninstall"): bộ gỡ không chạy, chỉ mục còn nguyên.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Cho phép bấm chạy tay từ tab Actions để thử build. Khi chạy tay, workflow
  # CHỈ build rồi dừng — không tạo Release, không tạo tag (xem bước cuối).
  workflow_dispatch:

# tauri-action cần quyền này để tạo Release và đính kèm file vào đó.
permissions:
  contents: write

jobs:
  release:
    # Bắt buộc là Windows: MediaFinder gọi thẳng Win32 API và đóng gói bằng NSIS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, không phải 20. `jsdom@30` — môi trường mà toàn bộ 170 bài kiểm
          # thử giao diện chạy trong đó — khai `engines.node` là
          # `^22.22.2 || ^24.15.0 || >=26.0.0`, và các gói con của nó
          # (`undici@8` cần >=22.19, `whatwg-url@17` cần ^22.14) cũng vậy.
          # Node 20 không nằm trong bất kỳ khoảng nào.
          #
          # Triệu chứng khi để 20: `npm test` chết sau ĐÚNG 7 GIÂY — chưa chạy
          # bài nào, vì nó hỏng lúc dựng môi trường jsdom. Bộ kiểm thử mất
          # ~100 giây, nên con số 7 giây chính là thứ phân biệt "hỏng môi
          # trường" với "có bài trượt"; đừng bỏ qua nó.
          #
          # Chọn 24 chứ không phải 22 vì đó là phiên bản đã chạy xanh toàn bộ
          # vòng kiểm tra trên máy phát triển (24.18.0, thoả `^24.15.0`).
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust build lâu nhất trong các bước; cache giúp lần chạy sau nhanh hơn nhiều.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài dependency frontend
        run: npm ci

      # Chặn ngay tại đây nếu mã nguồn hỏng, thay vì để build chạy 15 phút rồi mới lỗi.
      - name: Type-check frontend
        run: npm run check

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Ghi chú phát hành = changelog trong RELEASE_NOTES.md + vạch --- +
      # hướng dẫn cài cho người tải tay từ trang Releases. HỢP ĐỒNG với
      # UpdateNotice.svelte: ứng dụng cắt ở vạch --- và chỉ hiện phần trước —
      # người đang đứng trong app không cần ai dạy cách chạy bộ cài.
      # Chặn ngay từ đây nếu ghi chú rỗng hoặc quá dài — trước khi tốn 15
      # phút build ra một bản mà hộp thoại của nó bắt người dùng đọc tiểu luận.
      - name: Kiểm tra ghi chú phát hành
        shell: bash
        run: bash scripts/check-release-notes.sh

      - name: Đọc ghi chú phát hành
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat RELEASE_NOTES.md
            echo ''
            echo '---'
            echo ''
            echo '**Đang dùng MediaFinder rồi? Đừng tải gì ở đây.** Mở ứng dụng lên, nó sẽ'
            echo 'báo có bản mới và tự cập nhật khi bạn đồng ý. Đó là đường an toàn nhất:'
            echo 'bộ cập nhật trong ứng dụng không chạy qua bộ gỡ cài đặt, nên chỉ mục đã'
            echo 'quét — nhất là phần ổ mạng, thứ mất vài phút mới dựng lại được — không'
            echo 'bị đụng tới.'
            echo ''
            echo '**Cài lần đầu:** tải tệp `.exe` bên dưới rồi chạy.'
            echo ''
            echo 'Windows sẽ hiện cảnh báo màu xanh "Windows protected your PC" vì phần'
            echo 'mềm chưa mua chứng chỉ ký số. Bấm **More info** rồi **Run anyway**.'
            echo ''
            echo '**Cài tay đè lên bản cũ:** làm được, nhưng bộ cài sẽ hỏi một câu trước đó.'
            echo 'Từ bản này trở đi, chọn đường nào thì chỉ mục cũng được giữ lại — trừ khi'
            echo 'bạn tự tay tích ô xoá dữ liệu ứng dụng. **Các bản từ v1.0.5 trở về trước'
            echo 'thì không:** cài tay đè lên chúng sẽ xoá sạch chỉ mục, kể cả phần ổ mạng.'
            echo 'Nếu vừa gặp cảnh đó, mở ứng dụng rồi bấm **Quét lại**, và bấm thêm'
            echo '**+ ổ mạng** nếu bạn có dùng NAS.'
            echo ''
            echo '**Muốn quay về bản cũ?** Mọi bản đều tải được ở trang Releases này — cài đè'
            echo 'là xong. Nếu ứng dụng hỏi về chỉ mục, bấm **Quét lại** một lần là dùng tiếp.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Chạy tay (workflow_dispatch): chỉ build để kiểm tra là mọi thứ biên dịch
      # được. Không truyền tagName nên action không tạo Release và không tự gắn
      # tag lên commit hiện tại.
      - name: Build thử (chạy tay, không đăng Release)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Đẩy tag lên: build rồi tạo Release ở dạng draft.
      - name: Build bộ cài và đăng Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Khoá riêng ký bộ cài. Ứng dụng đang chạy trên máy người dùng chỉ
          # nhận bản cập nhật khớp với khoá công khai trong `tauri.conf.json`,
          # nên thiếu biến này thì build ra một bộ cài mà không ai cập nhật
          # lên được. Đặt ở Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Khoá được sinh không đặt mật khẩu, nhưng `rsign` vẫn mã hoá tệp
          # khoá và vẫn đòi biến này. Thiếu nó thì bước ký bị **bỏ qua trong
          # im lặng**: build báo thành công, ra bộ cài bình thường, chỉ là
          # không kèm chữ ký — và không máy nào cập nhật lên được.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # BẮT BUỘC khi phát hành từ một nhánh KHÔNG phải nhánh mặc định.
          #
          # tauri-action luôn gửi kèm `target_commitish` khi tạo Release:
          #
          #     target_commitish: commitish || context.sha
          #
          # Mặc định đó là SHA của commit đang được tag. Nếu commit ấy nằm
          # ngoài nhánh mặc định thì GitHub **từ chối** bằng HTTP 403
          # "Resource not accessible by integration" — một thông điệp nói về
          # quyền, trong khi nguyên nhân chẳng liên quan gì tới quyền. Nó đã
          # làm mất bốn lượt chẩn đoán đi sai hướng.
          #
          # Đo được, mỗi phép đổi đúng một biến, tag `v1.0.6` đã tồn tại:
          #   tag_name + name + draft                        -> 201
          #   + prerelease                                   -> 201
          #   + target_commitish = 99fc80b (trên `edit`)     -> 403
          #   + target_commitish = master                    -> 201
          #
          # Trường này an toàn để ép về nhánh mặc định: tài liệu của chính
          # input nói "unused if the Git tag already exists", và tag luôn tồn
          # tại trước khi workflow chạy (workflow kích hoạt bởi việc đẩy tag).
          # Nên Release vẫn gắn đúng vào tag, tức đúng commit trên `edit`.
          #
          # Dùng biểu thức chứ không viết cứng "master": đổi tên nhánh mặc
          # định thì chỗ này vẫn đúng.
          releaseCommitish: ${{ github.event.repository.default_branch }}
          # __VERSION__ được thay bằng version trong tauri.conf.json.
          tagName: v__VERSION__
          releaseName: MediaFinder v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          # Để nháp: bạn vào xem, thấy ổn thì tự bấm Publish. Đổi thành false
          # nếu muốn Release hiện ra công khai ngay khi build xong.
          releaseDraft: true
          # PHÁT HÀNH THEO ĐỢT — cần gạt an toàn của cả quy trình.
          #
          # Ứng dụng trên máy người dùng hỏi đúng một địa chỉ:
          #   .../releases/latest/download/latest.json
          # GitHub định nghĩa `/latest` là bản mới nhất **không phải
          # pre-release**. Nên một Release gắn cờ pre-release thì:
          #
          #   * KHÔNG máy nào tự cập nhật lên — `installMode: passive` nghĩa là
          #     bản thường sẽ tự cài, nên đây là khác biệt lớn;
          #   * tệp `.exe` VẪN tải được công khai từ trang Releases, đưa cho
          #     vài người thử.
          #
          # Thấy ổn thì vào GitHub bỏ tick "Set as a pre-release" — `/latest`
          # trỏ sang nó và cả studio mới nhận thông báo. Có chuyện thì tick
          # lại: mọi máy chưa nâng dừng ngay lập tức.
          #
          # Đặt `true` từ v1.0.6, bản chở nguyên cụm P21–P31 (~2.900 dòng qua
          # 33 tệp) mà chưa một máy nào ngoài kia chạy. Đổi về `false` khi lại
          # phát hành những bản nhỏ, đã quen tay.
          prerelease: true

# Đăng ký lại workflow với GitHub.
