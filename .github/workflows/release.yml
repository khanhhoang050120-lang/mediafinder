# Build bộ cài MediaFinder và đăng lên GitHub Releases.
#
# Cách phát hành một bản mới:
#   0. Viết "có gì mới" vào RELEASE_NOTES.md (ở gốc repo). Nội dung này đi
#      vào latest.json và ứng dụng cũ HIỆN NÓ trong hộp thoại mời cập nhật —
#      viết cho người dùng đọc, không phải cho lập trình viên.
#   1. Sửa version cho khớp nhau ở tất cả các chỗ sau:
#        src-tauri/tauri.conf.json   <- nguồn sự thật, Tauri đọc file này
#        package.json
#        package-lock.json           <- hai chỗ; lệch là `npm ci` fail ngay
#        src-tauri/Cargo.toml
#        src-tauri/Cargo.lock        <- dòng version của crate `mediafinder`
#   2. git commit
#   3. git tag v1.0.1 && git push origin master --tags
#
# Đẩy tag lên là workflow tự chạy. Khoảng 10-20 phút sau, bản Release có sẵn
# file .exe cho người dùng tải.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Cho phép bấm chạy tay từ tab Actions để thử build. Khi chạy tay, workflow
  # CHỈ build rồi dừng — không tạo Release, không tạo tag (xem bước cuối).
  workflow_dispatch:

# tauri-action cần quyền này để tạo Release và đính kèm file vào đó.
permissions:
  contents: write

jobs:
  release:
    # Bắt buộc là Windows: MediaFinder gọi thẳng Win32 API và đóng gói bằng NSIS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Khớp với check.yml. Hai workflow chạy trên hai phiên bản Node
          # khác nhau nghĩa là thứ đã được kiểm và thứ được đóng gói giao cho
          # người dùng không phải cùng một thứ.
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust build lâu nhất trong các bước; cache giúp lần chạy sau nhanh hơn nhiều.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài dependency frontend
        run: npm ci

      # Chặn ngay tại đây nếu mã nguồn hỏng, thay vì để build chạy 15 phút rồi mới lỗi.
      - name: Type-check frontend
        run: npm run check

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ---- ffmpeg đi kèm bộ cài ----
      #
      # Windows không đọc được ProRes (2/3 số .mov của studio): thiếu ffmpeg
      # thì các tệp đó không có ảnh thu nhỏ và không xem trước được. Bản dựng
      # tối giản ~10 MB mỗi exe, thay vì 242 MB của bản full — xem
      # scripts/build-ffmpeg-minimal.sh.
      #
      # Dựng lần đầu mất cỡ 20 phút trên máy CI. Nhớ kết quả theo mã băm của
      # script: phiên bản ffmpeg/x264 và mọi cờ dựng đều nằm trong script, nên
      # script không đổi thì bản dựng không đổi.
      - name: Lấy ffmpeg đã dựng từ lần trước
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          # `nguon/`: mã nguồn đúng bản đã dựng, đính kèm vào Release ở bước
          # cuối — phải nhớ cùng exe, vì lần lấy từ cache không có bản clone.
          path: |
            src-tauri/binaries/ffmpeg.exe
            src-tauri/binaries/ffprobe.exe
            src-tauri/binaries/LICENSE-ffmpeg.txt
            src-tauri/binaries/nguon
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg-minimal.sh') }}

      - name: Cài MSYS2 để dựng ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make diffutils nasm
            mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-pkgconf

      - name: Dựng ffmpeg tối giản
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-minimal.sh

      # Chạy cả khi lấy từ cache: script tự kiểm lúc dựng, nhưng một bản lấy
      # từ cache thì không đi qua script. Chạy từ PowerShell — NGOÀI MSYS2 —
      # là đúng hoàn cảnh của máy người dùng: exe nào lỡ đòi DLL của MSYS2
      # thì hỏng ngay ở đây chứ không phải trên 20–40 máy studio.
      - name: Kiểm ffmpeg chạy được ngoài MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($exe in 'ffmpeg', 'ffprobe') {
            $p = "src-tauri/binaries/$exe.exe"
            if (-not (Test-Path $p)) { throw "thiếu $p" }
            # Thiếu DLL thì Windows không khởi động nổi tiến trình và trả mã
            # -1073741515 (STATUS_DLL_NOT_FOUND).
            $v = & $p -version
            if ($LASTEXITCODE -ne 0) { throw "$exe.exe không chạy được (mã $LASTEXITCODE)" }
            $v[0]
          }
          $enc = & src-tauri/binaries/ffmpeg.exe -hide_banner -encoders
          if (-not ($enc -match 'libx264')) { throw 'ffmpeg thiếu libx264 — xem trước ProRes sẽ hỏng' }
          # GPL: không có mã nguồn để đính kèm thì không được phát hành.
          foreach ($m in 'ffmpeg-*-source.tar.gz', 'x264-*-source.tar.gz', 'build-ffmpeg-minimal.sh') {
            if (-not (Get-ChildItem "src-tauri/binaries/nguon/$m" -ErrorAction SilentlyContinue)) {
              throw "thiếu mã nguồn src-tauri/binaries/nguon/$m"
            }
          }
          if (-not (Select-String -Path src-tauri/binaries/LICENSE-ffmpeg.txt -Pattern 'GNU GENERAL PUBLIC LICENSE' -Quiet)) {
            throw 'LICENSE-ffmpeg.txt thiếu toàn văn GPL'
          }

      # Ghi chú phát hành = changelog trong RELEASE_NOTES.md + vạch --- +
      # hướng dẫn cài cho người tải tay từ trang Releases. HỢP ĐỒNG với
      # UpdateNotice.svelte: ứng dụng cắt ở vạch --- và chỉ hiện phần trước —
      # người đang đứng trong app không cần ai dạy cách chạy bộ cài.
      - name: Đọc ghi chú phát hành
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat RELEASE_NOTES.md
            echo ''
            echo '---'
            echo ''
            echo '**Đang dùng MediaFinder rồi?** Không cần tải gì ở đây — mở ứng dụng'
            echo 'lên, nó sẽ báo có bản mới và tự cập nhật khi bạn đồng ý.'
            echo ''
            echo '**Cài lần đầu:** tải tệp `.exe` bên dưới rồi chạy.'
            echo ''
            echo 'Windows sẽ hiện cảnh báo màu xanh "Windows protected your PC" vì phần'
            echo 'mềm chưa mua chứng chỉ ký số. Bấm **More info** rồi **Run anyway**.'
            echo ''
            echo '**Đang ở v1.0.4 mà muốn tải tay?** Hãy cập nhật bằng nút trong ứng dụng.'
            echo 'Tải `.exe` về cài đè sẽ chạy bộ gỡ cài đặt CŨ, và bộ gỡ đó xoá chỉ mục —'
            echo 'máy phải quét lại từ đầu, kể cả phần ổ mạng (mất vài phút).'
            echo ''
            echo 'Nếu buộc phải cài tay: ở màn hình bộ cài hỏi, chọn dòng dưới —'
            echo '**Do not uninstall** — rồi mới bấm Next.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Chạy tay (workflow_dispatch): chỉ build để kiểm tra là mọi thứ biên dịch
      # được. Không truyền tagName nên action không tạo Release và không tự gắn
      # tag lên commit hiện tại.
      - name: Build thử (chạy tay, không đăng Release)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Giống hệt bước phát hành bên dưới — bản build thử phải là đúng thứ
          # sẽ được phát hành, kể cả ffmpeg đi kèm.
          args: --config src-tauri/tauri.ffmpeg.conf.json

      # Build thử xong, bộ cài chỉ nằm trên máy CI và mất theo máy đó. Giữ nó
      # lại thành artifact của lượt chạy (tab Actions → lượt chạy → Artifacts)
      # để tải về cài tay lên MỘT máy thử — cách thử duy nhất không đụng tới
      # các máy khác, vì trình cập nhật chỉ đọc Release đã công bố.
      - name: Giữ bộ cài của bản build thử
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MediaFinder-build-thu-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          # Đủ để thử; không để 200 MB mỗi lượt nằm mãi trong kho của repo.
          retention-days: 7

      # Đẩy tag lên: build rồi tạo Release ở dạng draft.
      - name: Build bộ cài và đăng Release
        id: tauri
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Khoá riêng ký bộ cài. Ứng dụng đang chạy trên máy người dùng chỉ
          # nhận bản cập nhật khớp với khoá công khai trong `tauri.conf.json`,
          # nên thiếu biến này thì build ra một bộ cài mà không ai cập nhật
          # lên được. Đặt ở Settings → Secrets and variables → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Khoá được sinh không đặt mật khẩu, nhưng `rsign` vẫn mã hoá tệp
          # khoá và vẫn đòi biến này. Thiếu nó thì bước ký bị **bỏ qua trong
          # im lặng**: build báo thành công, ra bộ cài bình thường, chỉ là
          # không kèm chữ ký — và không máy nào cập nhật lên được.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # BẮT BUỘC khi phát hành từ một nhánh KHÔNG phải nhánh mặc định.
          #
          # tauri-action luôn gửi kèm `target_commitish` khi tạo Release:
          #
          #     target_commitish: commitish || context.sha
          #
          # Mặc định đó là SHA của commit đang được tag. Nếu commit ấy nằm
          # ngoài nhánh mặc định thì GitHub **từ chối** bằng HTTP 403
          # "Resource not accessible by integration" — một thông điệp nói về
          # quyền, trong khi nguyên nhân chẳng liên quan gì tới quyền. Nó đã
          # làm mất bốn lượt chẩn đoán đi sai hướng.
          #
          # Đo được, mỗi phép đổi đúng một biến, tag `v1.0.6` đã tồn tại:
          #   tag_name + name + draft                        -> 201
          #   + prerelease                                   -> 201
          #   + target_commitish = 99fc80b (trên `edit`)     -> 403
          #   + target_commitish = master                    -> 201
          #
          # Trường này an toàn để ép về nhánh mặc định: tài liệu của chính
          # input nói "unused if the Git tag already exists", và tag luôn tồn
          # tại trước khi workflow chạy (workflow kích hoạt bởi việc đẩy tag).
          # Nên Release vẫn gắn đúng vào tag, tức đúng commit trên `edit`.
          #
          # Dùng biểu thức chứ không viết cứng "master": đổi tên nhánh mặc
          # định thì chỗ này vẫn đúng.
          releaseCommitish: ${{ github.event.repository.default_branch }}
          # Đưa ffmpeg vào bộ cài. Tách khỏi tauri.conf.json vì khai tệp ở
          # `bundle.resources` thì tauri-build đòi tệp có mặt ngay lúc biên
          # dịch — kể cả `cargo test` trong check.yml, nơi không ai dựng
          # ffmpeg. Xem src-tauri/binaries/README.md.
          args: --config src-tauri/tauri.ffmpeg.conf.json
          # __VERSION__ được thay bằng version trong tauri.conf.json.
          tagName: v__VERSION__
          releaseName: MediaFinder v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          # Để nháp: bạn vào xem, thấy ổn thì tự bấm Publish. Đổi thành false
          # nếu muốn Release hiện ra công khai ngay khi build xong.
          releaseDraft: true
          # Bản thử. Trình cập nhật đọc `/releases/latest`, mà endpoint đó BỎ
          # QUA pre-release — nên 20–40 máy đang chạy v1.0.4 không nhận được
          # thông báo nào. Thử xong thấy ổn thì bỏ dấu pre-release trên GitHub
          # là các máy kia nhận được ngay, không cần build lại.
          # Bản phát hành thật. Đặt `true` là bản build thành vô hình với trình
          # cập nhật: endpoint `/releases/latest` mà app đọc BỎ QUA pre-release,
          # nên không máy nào nhận được thông báo.
          prerelease: false

      # GPL: bộ cài mang ffmpeg có libx264, nên ai tải bộ cài cũng phải lấy
      # được mã nguồn tương ứng — và cách chắc nhất là cho tải TỪ CÙNG MỘT CHỖ.
      # Ba tệp (mã nguồn ffmpeg, mã nguồn x264, script dựng) đi vào đúng trang
      # Release chứa bộ cài. LICENSE-ffmpeg.txt trong bộ cài trỏ về đây.
      #
      # Tên tag lấy từ output của tauri-action, khớp `tagName: v__VERSION__` ở
      # trên. Release đang là NHÁP, và `gh release upload` vẫn tìm được nó theo
      # tag (gh tự dò trong danh sách nháp khi API theo tag trả 404).
      # `--clobber`: chạy lại workflow thì thay tệp cũ, không hỏng vì trùng tên.
      - name: Đính kèm mã nguồn ffmpeg vào Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "v${{ steps.tauri.outputs.appVersion }}"
          src-tauri/binaries/nguon/*
          --repo "${{ github.repository }}" --clobber

# Đăng ký lại workflow với GitHub.
