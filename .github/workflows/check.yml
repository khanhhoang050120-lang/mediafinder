# Kiểm tra mã nguồn mỗi khi đẩy lên nhánh `edit` hoặc mở Pull Request.
#
# Đây là bốn lệnh trong "Vòng kiểm tra" của README, chạy trên máy sạch của
# GitHub thay vì máy bạn. Nó KHÔNG đóng gói bộ cài — việc đó chỉ xảy ra khi
# phát hành (xem release.yml), nên vòng này nhanh hơn nhiều.
name: Kiểm tra

on:
  push:
    branches:
      - edit
  # Chạy lại khi mở PR sang master, để biết nhánh có an toàn để gộp không.
  pull_request:
    branches:
      - master

# Đẩy commit mới lên khi lần chạy trước chưa xong thì huỷ lần cũ đi —
# kết quả của commit đã bị thay thế không còn giá trị gì.
#
# Gom theo **commit** chứ không theo nhánh: một commit trên `edit` đã mở PR
# sang `master` sẽ kích hoạt cả `push` lẫn `pull_request`. Gom theo nhánh thì
# hai sự kiện đó có ref khác nhau nên không huỷ được nhau, và cùng một mã
# nguồn phải build hai lần, mỗi lần hơn mười phút.
concurrency:
  group: check-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    # Cùng nền tảng với lúc phát hành: mã nguồn gọi thẳng Win32 API nên
    # kiểm tra trên Linux sẽ không biên dịch được.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, không phải 20. `jsdom@30` — môi trường mà toàn bộ 170 bài kiểm
          # thử giao diện chạy trong đó — khai `engines.node` là
          # `^22.22.2 || ^24.15.0 || >=26.0.0`, và các gói con của nó
          # (`undici@8` cần >=22.19, `whatwg-url@17` cần ^22.14) cũng vậy.
          # Node 20 không nằm trong bất kỳ khoảng nào.
          #
          # Triệu chứng khi để 20: `npm test` chết sau ĐÚNG 7 GIÂY — chưa chạy
          # bài nào, vì nó hỏng lúc dựng môi trường jsdom. Bộ kiểm thử mất
          # ~100 giây, nên con số 7 giây chính là thứ phân biệt "hỏng môi
          # trường" với "có bài trượt"; đừng bỏ qua nó.
          #
          # Chọn 24 chứ không phải 22 vì đó là phiên bản đã chạy xanh toàn bộ
          # vòng kiểm tra trên máy phát triển (24.18.0, thoả `^24.15.0`).
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài dependency frontend
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      # Định dạng chạy trước vì nó nhanh nhất và hỏng thì sửa dễ nhất.
      - name: Định dạng Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 161 bài / 15 nhóm canh hợp đồng giao diện — chúng chỉ sống nếu có người
      # nhớ gõ tay, và người thì quên. Thêm vào đây sau khi P29 phát hiện cả hai
      # workflow đều chạy `npm run check` (chỉ kiểm kiểu) mà không chạy `npm test`.
      - name: Kiểm thử giao diện
        run: npm test

