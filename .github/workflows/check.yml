# Kiểm tra mã nguồn mỗi khi đẩy lên một nhánh làm việc, hoặc mở Pull Request.
#
# Đây là bốn lệnh trong "Vòng kiểm tra" của README, chạy trên máy sạch của
# GitHub thay vì máy bạn. Nó KHÔNG đóng gói bộ cài — việc đó chỉ xảy ra khi
# phát hành (xem release.yml), nên vòng này nhanh hơn nhiều.
name: Kiểm tra

on:
  push:
    branches-ignore:
      # Mọi nhánh trừ `master`. Trước đây chỗ này liệt kê đúng một nhánh
      # (`edit`) — và khi nhánh đó bị xoá thì CI lặng lẽ ngừng chạy trên mọi
      # thứ, không báo lỗi, không ai nhận ra. `version2` đã nhận ba commit mà
      # không lần nào đi qua vòng kiểm này.
      #
      # Dùng danh sách LOẠI TRỪ thay vì danh sách cho phép, để một nhánh mới
      # được kiểm ngay từ commit đầu tiên chứ không phải chờ ai đó nhớ ra mà
      # thêm tên nó vào đây.
      #
      # `master` nằm ngoài vì mọi thứ vào được đó đều đã qua vòng này ở dạng
      # PR — chạy lại là trả tiền hai lần cho cùng một câu trả lời.
      - master
  # Chạy lại khi mở PR sang master, để biết nhánh có an toàn để gộp không.
  pull_request:
    branches:
      - master

# Đẩy commit mới lên khi lần chạy trước chưa xong thì huỷ lần cũ đi —
# kết quả của commit đã bị thay thế không còn giá trị gì.
#
# Gom theo **commit** chứ không theo nhánh: một commit trên `edit` đã mở PR
# sang `master` sẽ kích hoạt cả `push` lẫn `pull_request`. Gom theo nhánh thì
# hai sự kiện đó có ref khác nhau nên không huỷ được nhau, và cùng một mã
# nguồn phải build hai lần, mỗi lần hơn mười phút.
concurrency:
  group: check-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    # Cùng nền tảng với lúc phát hành: mã nguồn gọi thẳng Win32 API nên
    # kiểm tra trên Linux sẽ không biên dịch được.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, không phải 20. `jsdom@30` — thư viện giả lập trình duyệt mà
          # bộ kiểm thử giao diện chạy trên đó — đòi Node ^22.22.2 || ^24.15.0
          # || >=26. Với Node 20 thì `npm test` chết trong bảy giây, và thông
          # điệp lỗi trông y hệt một bài kiểm thử hỏng: đã mất một lượt chẩn
          # đoán đi sai hướng vì chuyện này.
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài dependency frontend
        run: npm ci

      - name: Type-check frontend
        run: npm run check

      # Định dạng chạy trước vì nó nhanh nhất và hỏng thì sửa dễ nhất.
      - name: Định dạng Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Bước này trước đây KHÔNG tồn tại, nên toàn bộ bộ kiểm thử giao diện
      # chưa từng chạy trên CI lần nào — kể cả các bài canh những lỗi đắt nhất
      # đã gặp: kéo nhầm tệp sau khi đổi ổ đĩa, và màn hình khẳng định "không
      # tìm thấy kết quả nào" trong khi lần tìm vẫn đang chạy.
      #
      # Chúng chỉ xanh vì có người nhớ chạy tay. Một tấm lưới an toàn phụ
      # thuộc vào trí nhớ thì không phải lưới an toàn.
      #
      # Chạy sau phần Rust vì nó lâu hơn hẳn (~100 giây so với vài giây): hỏng
      # ở phần rẻ thì biết ngay, không phải chờ hết phần đắt.
      - name: Test frontend
        run: npm test
