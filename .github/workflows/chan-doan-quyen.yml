# Workflow chẩn đoán — dùng xong thì xoá.
#
# Câu hỏi: vì sao `tauri-action` không tạo được Release cho v1.0.6, trong khi
# log của chính lượt chạy đó in ra `GITHUB_TOKEN Permissions — Contents: write`?
#
# Đã loại trừ bằng phép thử, không phải suy đoán: quyền token, cài đặt repo,
# ref dạng tag, tag nằm ngoài nhánh mặc định, và chuyện tauri-action tự đổi
# phiên bản. Còn lại: payload của nó khác payload thử nghiệm ở bốn trường.
#
# MỖI PHÉP THỬ LÀ MỘT JOB RIÊNG, và job ĐỎ khi không nhận được 201.
#
# Lý do: bản trước in mã HTTP ra màn hình rồi kết thúc "success" bất kể kết
# quả — nên toàn bộ thông tin nằm trong log, thứ chỉ đọc được khi đăng nhập.
# Kết luận của JOB thì API công khai đọc được. Một phép đo mà người cần nó
# không đọc được thì không phải phép đo.
name: Chẩn đoán quyền

on:
  workflow_dispatch:
  push:
    tags:
      - 'chan-doan-*'

permissions:
  contents: write

jobs:
  # ---- P1: đối chứng. Tag đã tồn tại, payload tối giản. Mong đợi 201. -------
  p1-doi-chung:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo release nháp cho v1.0.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo '{"tag_name":"v1.0.6","name":"P1","draft":true}' > /tmp/p.json
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases" -d @/tmp/p.json)
          echo "HTTP $code"; cat /tmp/r.json
          id=$(python3 -c "import json;print(json.load(open('/tmp/r.json')).get('id',''))" 2>/dev/null || true)
          if [ -n "$id" ]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/$id"; fi
          test "$code" = "201"

  # ---- P2: thêm ĐÚNG một biến — prerelease. --------------------------------
  p2-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo release nháp + prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo '{"tag_name":"v1.0.6","name":"P2","draft":true,"prerelease":true}' > /tmp/p.json
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases" -d @/tmp/p.json)
          echo "HTTP $code"; cat /tmp/r.json
          id=$(python3 -c "import json;print(json.load(open('/tmp/r.json')).get('id',''))" 2>/dev/null || true)
          if [ -n "$id" ]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/$id"; fi
          test "$code" = "201"

  # ---- P3: thêm ĐÚNG một biến — target_commitish (nghi can chính). ---------
  # tauri-action luôn gửi trường này: `target_commitish: commitish || context.sha`.
  p3-target-commitish:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo release nháp + target_commitish trỏ ngoài nhánh mặc định
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo '{"tag_name":"v1.0.6","name":"P3","draft":true,"target_commitish":"99fc80bb673bad6396763afb58d1ac4f4e5dfe67"}' > /tmp/p.json
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases" -d @/tmp/p.json)
          echo "HTTP $code"; cat /tmp/r.json
          id=$(python3 -c "import json;print(json.load(open('/tmp/r.json')).get('id',''))" 2>/dev/null || true)
          if [ -n "$id" ]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/$id"; fi
          test "$code" = "201"

  # ---- P5: BAN SUA DE XUAT — target_commitish tro vao NHANH MAC DINH. ----
  # `releaseCommitish` cua tauri-action noi: "unused if the Git tag already
  # exists". Tag v1.0.6 da ton tai, nen gia tri nay khong duoc dung toi — no chi
  # can vuot qua khau kiem tra cua GitHub. Job XANH nghia la ban sua chay duoc.
  p5-commitish-master:
    runs-on: ubuntu-latest
    steps:
      - name: Tao release nhap + target_commitish = master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo '{"tag_name":"v1.0.6","name":"P5","draft":true,"prerelease":true,"target_commitish":"master"}' > /tmp/p.json
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases" -d @/tmp/p.json)
          echo "HTTP $code"; cat /tmp/r.json
          id=$(python3 -c "import json;print(json.load(open('/tmp/r.json')).get('id',''))" 2>/dev/null || true)
          if [ -n "$id" ]; then
            echo "  kiem tra release vua tao tro vao tag nao:"
            python3 -c "import json;d=json.load(open('/tmp/r.json'));print('   tag_name =',d.get('tag_name'),'| target_commitish =',d.get('target_commitish'))"
            curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/$id"
          fi
          test "$code" = "201"

  # ---- P4: repo có "Tag protection rules" kiểu CŨ không? -------------------
  # Tính năng này nằm riêng khỏi Rulesets, nên phép kiểm /rulesets trước đó
  # không nhìn thấy nó. Job ĐỎ nghĩa là CÓ luật bảo vệ tag.
  p4-tag-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Đọc luật bảo vệ tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/tp.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/tags/protection")
          echo "tags/protection -> HTTP $code"; cat /tmp/tp.json
          n=$(python3 -c "import json;d=json.load(open('/tmp/tp.json'));print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo 0)
          echo "so luat bao ve tag: $n"
          test "$n" = "0"
